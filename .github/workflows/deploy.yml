name: Deploy Godot Web

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Godot (latest)
        uses: chickensoft-games/setup-godot@v1
        with:
          godot-version: "latest"

      - name: Exportar Web
        run: |
          mkdir -p dist
          godot --headless --export-release "Web" dist/index.html
